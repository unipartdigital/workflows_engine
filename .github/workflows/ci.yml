name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
      - name: Install dependencies
        run: |
          pip install -r pip-requirements-test.txt
          pip install .[test]
      - name: Run tests
        run: pytest src
